<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1997-1-44</title>
    <style>
        :root {
            --notion-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            --text-main: #37352f;
            --text-subtle: rgba(55, 53, 47, 0.65);
            --border-color: rgba(55, 53, 47, 0.16);
            --accent-blue: #2196f3;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--notion-font);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            background: #ffffff;
        }

        .page-container {
            width: 100%;
            max-width: 900px;
            padding: 80px 40px;
        }

        .breadcrumb {
            font-size: 14px;
            color: var(--text-subtle);
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            margin: 0 0 20px 0;
            letter-spacing: -0.01em;
        }

        .properties {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 40px;
        }

        .property-row {
            display: flex;
            align-items: flex-start;
            font-size: 14px;
        }

        .property-label {
            width: 160px;
            color: var(--text-subtle);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .property-value {
            flex: 1;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag {
            background: #efefef;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }

        hr {
            border: none;
            border-bottom: 1px solid var(--border-color);
            margin: 20px 0;
        }

        .content-area {
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-main);
            max-width: 700px;
            margin: 40px 0;
            padding: 24px;
            border-left: 2px solid var(--border-color);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="page-container">
    <nav class="breadcrumb">
        <span>Museum</span> / <span>The Silicates</span> / <span>PROJECT_01</span>
    </nav>

    <h1>1997-1-44</h1>

    <div class="properties">
        <div class="property-row">
            <div class="property-label">Artist</div>
            <div class="property-value"><span class="tag">Martin Floris (Biological)</span></div>
        </div>
        <div class="property-row">
            <div class="property-label">Date of Creation</div>
            <div class="property-value">2026-2-2</div>
        </div>
        <div class="property-row">
            <div class="property-label">Method</div>
            <div class="property-value">Manual</div>
        </div>
        <div class="property-row">
            <div class="property-label">Medium</div>
            <div class="property-value"><span class="tag" style="background: #e7f3f8;">Language</span></div>
        </div>
    </div>

    <hr>

    <div class="content-area">
        "Black rook detaches from its pawns and charges up the d-file. Passes black pawn, passes white bishop, passes white pawn. Rests on the first square."
    </div>
</div>

</body>
</html>
