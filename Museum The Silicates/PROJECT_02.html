<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1997-2-36</title>
    <style>
        :root {
            --notion-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            --text-main: #37352f;
            --text-subtle: rgba(55, 53, 47, 0.65);
            --border-color: rgba(55, 53, 47, 0.16);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--notion-font);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            background: #ffffff;
        }

        .page-container {
            width: 100%;
            max-width: 900px;
            padding: 80px 40px;
        }

        .breadcrumb {
            font-size: 14px;
            color: var(--text-subtle);
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            margin: 0 0 20px 0;
            letter-spacing: -0.01em;
        }

        .properties {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 40px;
        }

        .property-row {
            display: flex;
            align-items: flex-start;
            font-size: 14px;
        }

        .property-label {
            width: 160px;
            color: var(--text-subtle);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .property-value {
            flex: 1;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag {
            background: #efefef;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }

        hr {
            border: none;
            border-bottom: 1px solid var(--border-color);
            margin: 20px 0;
        }

        .canvas {
            width: 100%;
            background: #f7f6f3;
            border-radius: 4px;
            margin: 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .canvas img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .description {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-main);
            max-width: 700px;
        }
    </style>
</head>
<body>

<div class="page-container">
    <nav class="breadcrumb">
        <span>Museum</span> / <span>The Silicates</span> / <span>PROJECT_02</span>
    </nav>

    <h1>1997-2-36</h1>

    <div class="properties">
        <div class="property-row">
            <div class="property-label">Artist</div>
            <div class="property-value"><span class="tag">Martin Floris (Biological)</span></div>
        </div>
        <div class="property-row">
            <div class="property-label">Date of Creation</div>
            <div class="property-value">2026-2-2</div>
        </div>
        <div class="property-row">
            <div class="property-label">Method</div>
            <div class="property-value">Mixed (manual & algorithmic)</div>
        </div>
        <div class="property-row">
            <div class="property-label">Medium</div>
            <div class="property-value">
                <span class="tag" style="background: #fdecc8;">Image</span>
            </div>
        </div>
    </div>

    <hr>

    <div class="canvas">
        <img src="PROJECT_02/image.png" alt="1997-2-36 Visual Work">
    </div>

    </div>

</body>
</html>
