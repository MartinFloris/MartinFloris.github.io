# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Gate the deploy on the house-style checks. A page can be valid HTML with a
  # correct hash and still ship a dead theme toggle or invisible dark-mode text;
  # scripts/check_site.py catches that class of bug, so a failure here keeps it
  # off the live site rather than reporting it afterwards.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No setup-python step: the scripts are stdlib-only and ubuntu-latest
      # already ships a current Python 3, so this needs no extra pinned action.
      - name: Check site against the house shell
        run: python3 scripts/check_site.py

  # Single deploy job since we're just deploying
  deploy:
    needs: check
    environment:
      name: github-pages
      url: https://www.thesilicates.com/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # Assemble only the visitor-facing surface into a staging directory.
      # The repo root also holds Worker source, maintenance scripts, and
      # agent/tool configuration that must never be served by Pages —
      # projects.json is the one root data file kept in, because project11/
      # project12/project13 fetch it client-side to verify their own hashes.
      - name: Assemble site artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html CNAME favicon.png og-image.png handshake.js registry.html robots.txt llms.txt sitemap.xml submit.txt scripts.js styles.css projects.json _site/
          cp -r collections _site/collections
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'
      # actions/deploy-pages occasionally fails with a generic transient
      # "Deployment failed, try again later" error from GitHub's own Pages
      # backend. Retrying against the same already-uploaded artifact (rather
      # than re-running the whole job) clears it without risking the
      # duplicate-artifact issue that "Re-run failed jobs" causes.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true
      - name: Wait before retry 1
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true
      - name: Wait before retry 2
        if: steps.deploy2.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (attempt 3)
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
