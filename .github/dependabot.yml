# Version updates wait 5 days after a release, so a compromised version is
# usually pulled before it reaches a PR. Security updates are exempt from the
# cooldown. Packages installed by hand are reviewed in their PR's diff.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci

